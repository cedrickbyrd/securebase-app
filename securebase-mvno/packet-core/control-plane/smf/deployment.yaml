apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-smf
  namespace: securebase-packet-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: free5gc-smf
  template:
    metadata:
      labels:
        app: free5gc-smf
      annotations:
        k8s.v1.cni.cncf.io/networks: n4-pfcp-cp-nad
    spec:
      serviceAccountName: mvno-wif-control-plane
      containers:
        - name: smf
          image: ghcr.io/free5gc/smf:v3.4.3-r17
          env:
            - name: CORELINK_OPA_WEBHOOK
              value: "http://127.0.0.1:8085/v1/mcp/authorize-session"
          ports:
            - containerPort: 8805
              protocol: UDP
