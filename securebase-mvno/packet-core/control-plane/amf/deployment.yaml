apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-amf
  namespace: securebase-packet-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: free5gc-amf
  template:
    metadata:
      labels:
        app: free5gc-amf
      annotations:
        k8s.v1.cni.cncf.io/networks: n2-ngap-sctp-nad
    spec:
      serviceAccountName: mvno-wif-control-plane
      containers:
        - name: amf
          image: ghcr.io/free5gc/amf:v3.4.3-r17
          ports:
            - containerPort: 38412
              protocol: SCTP
            - containerPort: 8000
              protocol: TCP
