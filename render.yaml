services:
  - type: web
    name: securebase-api
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Prompts you to enter the secret value in the Render UI
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
